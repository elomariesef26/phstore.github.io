<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Scan & Caisse</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>



<div class="tape">
  <header>
    <p class="eyebrow">Ticket de caisse</p>
    <h1>Scan &amp; Caisse</h1>
    <p class="sub">Scannez un code-barres pour l'ajouter au panier</p>
  </header>

  <div class="scan-zone">
    <div id="reader"></div>
    <div class="scan-controls">
      <button class="btn-primary" id="startBtn">Démarrer le scan</button>
      <button class="btn-secondary" id="stopBtn" style="display:none;">Arrêter</button>
    </div>
    <div class="manual-entry">
      <input type="text" id="manualCode" placeholder="Ou saisir le code-barres manuellement">
      <button class="btn-secondary" id="manualBtn" style="flex:0 0 auto;">Ajouter</button>
    </div>
    <p class="status-line" id="statusLine">Prêt à scanner.</p>
  </div>

  <div class="receipt-body">
    <div class="cols">
      <span>Produit</span>
      <span style="text-align:center;">Prix</span>
      <span style="text-align:center;">Qté</span>
      <span style="text-align:right;">S/Total</span>
      <span></span>
    </div>
    <div id="itemsList"></div>
    <div class="empty-state" id="emptyState">
      <div class="glyph">▮▮▮ ▯ ▮▯▮</div>
      Aucun article scanné pour le moment.
    </div>
  </div>

  <div class="totals">
    <div class="line"><span>Articles</span><span id="itemCount">0</span></div>
    <div class="line"><span>Quantité totale</span><span id="qtyCount">0</span></div>
    <div class="grand">
      <span class="label">Total</span>
      <span class="amount" id="grandTotal">0,00 €</span>
    </div>
  </div>

  <div class="footer-actions">
    <button class="btn-secondary" id="exportBtn">Exporter en CSV</button>
    <button class="btn-ghost" id="resetBtn">Réinitialiser</button>
  </div>
</div>

<!-- Modal de saisie produit -->
<div id="modalOverlay" style="display:none; position:fixed; inset:0; background:rgba(32,32,28,0.55); z-index:50; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--paper); border-radius:14px; max-width:400px; width:100%; padding:22px;">
    <p style="font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.15em; color:var(--ribbon); margin:0 0 4px;">Nouvel article</p>
    <h2 style="font-family:'IBM Plex Mono',monospace; font-size:18px; margin:0 0 14px;">Code : <span id="modalCode"></span></h2>

    <label style="display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px;">Nom du produit</label>
    <input type="text" id="modalName" style="width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; margin-bottom:12px; font-size:14px;">

    <label style="display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px;">Prix unitaire (€)</label>
    <input type="number" id="modalPrice" step="0.01" min="0" style="width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; margin-bottom:12px; font-size:14px;">

    <label style="display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px;">Quantité</label>
    <input type="number" id="modalQty" value="1" min="1" style="width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; margin-bottom:18px; font-size:14px;">

    <div style="display:flex; gap:10px;">
      <button class="btn-secondary" id="modalCancel" style="flex:1;">Annuler</button>
      <button class="btn-primary" id="modalConfirm" style="flex:1;">Ajouter au panier</button>
    </div>
  </div>
</div>

<audio id="beepSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script src="app.js"></script>
</body>
</html>
